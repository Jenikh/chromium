name: Build and release Chromium for Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: chromium-windows-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  DEPOT_TOOLS_WIN_TOOLCHAIN: "0"

jobs:
  build-release:
    name: Windows x64
    runs-on: [self-hosted, Windows, X64, chromium-builder]
    timeout-minutes: 1440

    steps:
      - name: Check out Chromium
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          filter: blob:none

      - name: Install or update depot_tools
        shell: pwsh
        run: |
          $depotTools = Join-Path $env:RUNNER_TOOL_CACHE "depot_tools"
          if (Test-Path (Join-Path $depotTools ".git")) {
            git -C $depotTools pull --ff-only
          } else {
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $depotTools
          }
          $depotTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure the Chromium dependency checkout
        shell: pwsh
        run: |
          @'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["win"]
          '@ | Set-Content -LiteralPath .gclient -Encoding utf8

      - name: Synchronize Chromium dependencies
        shell: pwsh
        run: |
          gclient sync --no-history --nohooks
          gclient runhooks

      - name: Generate the release build
        working-directory: src
        shell: pwsh
        run: |
          gn gen out/Release --args='is_debug=false is_component_build=false symbol_level=0 target_cpu="x64"'
          autoninja -C out/Release chrome mini_installer

      - name: Prepare release files
        id: package
        shell: pwsh
        run: |
          $safeTag = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          $assetName = "chromium-no-space-encoding-windows-x64-$safeTag.exe"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $assetPath = Join-Path $releaseDir $assetName
          Copy-Item -LiteralPath "src/out/Release/mini_installer.exe" -Destination $assetPath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath "$assetPath.sha256" -Encoding ascii
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-windows-x64-${{ env.RELEASE_TAG }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.asset_path }}.sha256
          if-no-files-found: error

      - name: Create GitHub release and upload installer
        uses: actions/github-script@v7
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const prerelease = process.env.IS_PRERELEASE === 'true';

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Chromium ${tag}`,
                body: 'Custom Windows x64 Chromium build that preserves literal spaces in URL paths. This intentionally differs from the URL Standard.',
                draft: false,
                prerelease,
                generate_release_notes: true,
              })).data;
            }

            for (const path of [process.env.ASSET_PATH, `${process.env.ASSET_PATH}.sha256`]) {
              const name = path.split(/[\\/]/).pop();
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: release.id,
                per_page: 100,
              });
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(path),
              });
            }
